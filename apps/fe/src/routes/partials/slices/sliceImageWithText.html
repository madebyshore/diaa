<section class="slice-image-with-text" data-slice="sliceImageWithText">
  {{#hasTitle}}
  <!-- titleHtml is build-time-rendered stylized rich text (<strong>/<em>
       preserved, content escaped) — hence the triple-mustache. -->
  <h2 class="slice-image-with-text__title">{{{titleHtml}}}</h2>
  {{/hasTitle}}
  {{#image}}
  <div class="slice-image-with-text__media slice-image-with-text__media--ar-{{aspect}}">
    {{> picture}}
  </div>
  {{/image}}
  {{#hasText}}
  <div class="slice-image-with-text__text">{{{textHtml}}}</div>
  {{/hasText}}
</section>
