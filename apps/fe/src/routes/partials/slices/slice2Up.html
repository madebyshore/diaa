<section class="slice-2up slice-2up--{{layout}}{{#bottomAligned}} slice-2up--bottom-aligned{{/bottomAligned}}" data-slice="slice2Up">
  {{#images}}
  <figure class="slice-2up__item">
    <div class="slice-2up__media">
      {{#image}}{{> picture}}{{/image}}
    </div>
    {{#hasCaption}}
    <figcaption class="slice-caption">{{{captionHtml}}}</figcaption>
    {{/hasCaption}}
  </figure>
  {{/images}}
</section>
